name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: build
        run: forge build --sizes
      - name: test
        run: forge test -vv
      - name: invariants
        run: forge test --match-path "test/invariants/*" -vv
