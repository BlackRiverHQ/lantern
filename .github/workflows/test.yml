name: test

on:
  push:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build --sizes

      - name: Unit, fuzz and integration
        run: forge test --no-match-path "test/invariants/*" -vv

      - name: Invariants
        run: forge test --match-path "test/invariants/*"
