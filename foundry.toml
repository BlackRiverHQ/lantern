[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
verbosity = 2
fs_permissions = [{ access = "read", path = "./fixtures" }]
gas_reports = ["Lantern", "FeedRegistry", "BondVault", "EscrowBook"]

[fuzz]
runs = 256
max_test_rejects = 200000

[invariant]
runs = 64
depth = 32
fail_on_revert = false
call_override = false

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
int_types = "long"

[rpc_endpoints]
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
arbitrum_sepolia_public = "https://arbitrum-sepolia-rpc.publicnode.com"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api" }
